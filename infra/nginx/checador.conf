# Nginx para el VPS (Ubuntu). Dueño: Jeshua E. Pérez
# Copiar a /etc/nginx/sites-available/checador y enlazar en sites-enabled.
# Certbot agrega el bloque HTTPS:  sudo certbot --nginx -d checador.ejemplo.com

server {
    listen 80;
    server_name checador.ejemplo.com;   # cambiar por el dominio real

    # Videos y selfies (Multer); ajustar al tamaño máximo de video
    client_max_body_size 200M;

    # API REST
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;          # DeepFace en CPU puede tardar varios segundos
    }

    # Socket.IO (tiempo real). Sin estos encabezados el WebSocket no funciona.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Fotos y videos (la autorización la valida Node)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # Dashboard del Roku (build de /dashboard-tv)
    location /tv/ {
        alias /var/www/checador/tv/;
        try_files $uri $uri/ /tv/index.html;
    }

    # Panel admin (build de /panel-admin)
    location /admin/ {
        alias /var/www/checador/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        return 302 /admin/;
    }

    # El face-service (puerto 8000) NO se publica: solo lo usa Node en 127.0.0.1
}
